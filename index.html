<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versatile DAW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="daw-container">
    <header class="header">
      <div class="brand">
        <h1>VERSATILE</h1>
        <span class="badge">BASSLINE SYNTH</span>
      </div>
      <div class="transport">
        <button id="playBtn" class="btn play-btn">PLAY</button>
        <div class="bpm-box">
          <span class="label">TEMPO</span>
          <input type="number" id="bpm" value="124" min="40" max="240">
          <span class="unit">BPM</span>
        </div>
      </div>
    </header>

    <main class="rack">
      <!-- MODULE FILTRE & ENV FILTRE -->
      <section class="module">
        <div class="module-header">
          <h2>FILTER & MODULATION</h2>
        </div>
        <div class="knob-grid">
          <div class="knob-group">
            <span class="group-title">FILTER</span>
            <div class="knobs">
              <div class="knob-wrap" data-param="filterCutoff" data-min="20" data-max="15000" data-val="1200" data-step="10" data-unit="Hz" data-label="Cutoff"></div>
              <div class="knob-wrap" data-param="filterRes" data-min="0.1" data-max="25" data-val="6" data-step="0.1" data-unit="" data-label="Res (Q)"></div>
              <div class="knob-wrap" data-param="filterEnvAmt" data-min="-8000" data-max="8000" data-val="4000" data-step="50" data-unit="Hz" data-label="Env Amt"></div>
            </div>
          </div>

          <div class="knob-group">
            <span class="group-title">FILTER ENVELOPE</span>
            <div class="knobs">
              <div class="knob-wrap" data-param="fAttack" data-min="0.001" data-max="2" data-val="0.005" data-step="0.005" data-unit="s" data-label="Attack"></div>
              <div class="knob-wrap" data-param="fDecay" data-min="0.01" data-max="2" data-val="0.18" data-step="0.01" data-unit="s" data-label="Decay"></div>
              <div class="knob-wrap" data-param="fSustain" data-min="0" data-max="1" data-val="0.1" data-step="0.01" data-unit="%" data-label="Sustain"></div>
              <div class="knob-wrap" data-param="fRelease" data-min="0.01" data-max="3" data-val="0.15" data-step="0.01" data-unit="s" data-label="Release"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- MODULE AMPLITUDE ADSR -->
      <section class="module">
        <div class="module-header">
          <h2>AMPLIFIER ENVELOPE</h2>
        </div>
        <div class="knob-grid">
          <div class="knob-group">
            <span class="group-title">AMP ADSR</span>
            <div class="knobs">
              <div class="knob-wrap" data-param="ampAttack" data-min="0.001" data-max="1.5" data-val="0.005" data-step="0.005" data-unit="s" data-label="Attack"></div>
              <div class="knob-wrap" data-param="ampDecay" data-min="0.01" data-max="2" data-val="0.22" data-step="0.01" data-unit="s" data-label="Decay"></div>
              <div class="knob-wrap" data-param="ampSustain" data-min="0" data-max="1" data-val="0.0" data-step="0.01" data-unit="%" data-label="Sustain"></div>
              <div class="knob-wrap" data-param="ampRelease" data-min="0.01" data-max="2" data-val="0.08" data-step="0.01" data-unit="s" data-label="Release"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- MODULE SEQUENCEUR 16 PAS -->
      <section class="module">
        <div class="module-header">
          <h2>16-STEP SEQUENCER</h2>
        </div>
        <div class="grid" id="sequencerGrid"></div>
      </section>
    </main>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
