<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versatile DAW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="daw-container">
    <header class="header">
      <h1>VERSATILE DAW</h1>
      <div class="transport">
        <button id="playBtn" class="btn primary">PLAY</button>
        <div class="control-group">
          <label for="bpm">BPM</label>
          <input type="number" id="bpm" value="124" min="60" max="200">
        </div>
      </div>
    </header>

    <main class="rack">
      <section class="module synth-params">
        <h2>BASS ENGINE</h2>
        <div class="param-row">
          <label>Cutoff: <input type="range" id="cutoff" min="50" max="8000" value="1500"></label>
          <label>Resonance: <input type="range" id="resonance" min="0" max="20" step="0.5" value="6"></label>
          <label>Decay: <input type="range" id="decay" min="0.05" max="0.8" step="0.01" value="0.2"></label>
        </div>
      </section>

      <section class="module sequencer-module">
        <h2>16-STEP SEQUENCER</h2>
        <div class="grid" id="sequencerGrid"></div>
      </section>
    </main>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
